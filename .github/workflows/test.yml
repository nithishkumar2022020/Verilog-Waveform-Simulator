name: Test extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y iverilog xvfb
      - if: runner.os == 'macOS'
        run: brew install icarus-verilog
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-ucrt-x86_64-iverilog
          msystem: UCRT64
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:simulation
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - if: runner.os != 'Linux'
        run: npm test
      - run: npx --yes @vscode/vsce@3.6.2 package -o classroom.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ runner.os }}
          path: classroom.vsix
